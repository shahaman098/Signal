apiVersion: v1
kind: Namespace
metadata:
  name: signal
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: signal-api
  namespace: signal
  labels:
    app: signal-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: signal-api
  template:
    metadata:
      labels:
        app: signal-api
    spec:
      containers:
        - name: api
          image: REPLACE_WITH_ACR_IMAGE
          imagePullPolicy: Always
          ports:
            - containerPort: 4000
              name: http
          env:
            - name: NODE_ENV
              value: production
            - name: HOST
              value: 0.0.0.0
            - name: PORT
              value: "4000"
          envFrom:
            - secretRef:
                name: signal-api-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: signal-api
  namespace: signal
spec:
  type: LoadBalancer
  selector:
    app: signal-api
  ports:
    - name: http
      port: 80
      targetPort: http
